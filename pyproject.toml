[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-teleop"
version = "0.1.0"
description = "Unitree G1 teleoperation (sim + hardware) on the geo-kin-core interface."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "mujoco", "geo-kin-core"]

[project.optional-dependencies]
hw = ["unitree_sdk2py"]
devices = []  # xrt-device, mediapipe-device once split out

[tool.setuptools.packages.find]
include = ["g1_teleop*"]
