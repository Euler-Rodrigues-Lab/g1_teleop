name: Public Python integration
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      MUJOCO_GL: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: uv venv
      - name: Install pinned core, public devices and robot
        run: uv pip install "eurola-geo-kin-core[fallback]==0.1.2" "eurola-xrt-devices[xr,recording]==0.1.2" -e '.[test]'
      - name: Public tests including solver fallback
        run: .venv/bin/python -m pytest -q -m 'not geo'
